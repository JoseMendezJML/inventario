name: Pruebas automatizadas - Inventario

on:
  push:
    branches:
      - main


permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4


      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
        
      - name: Verificar sintaxis
        run: |
          php -1 src/validaciones.php
          php -1 tests/test_validaciones.php

      - name: Ejecutar pruebas
        run: php tests/test_validaciones.php